<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Agenda de clientes e ordens de serviço">
<title>Controle de Clientes</title><link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
<header class="header"><div><div class="kicker">CONTROLE DE CLIENTES</div><h1>Agenda</h1><p>Clientes, datas previstas e ordens de serviço.</p></div><button id="newBtn" class="btn primary">＋ Novo cliente</button></header>
<section class="stats" aria-label="Resumo"><button data-stat="all"><span>Total</span><strong id="sTotal">0</strong></button><button data-stat="pending"><span>Pendentes</span><strong id="sPending">0</strong></button><button data-stat="today"><span>Hoje</span><strong id="sToday">0</strong></button><button data-stat="overdue"><span>Atrasados</span><strong id="sOverdue">0</strong></button><button data-stat="done"><span>Concluídos</span><strong id="sDone">0</strong></button></section>
<section class="toolbar"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="Buscar cliente, OS ou observação…"></label><select id="status"><option value="all">Todos os status</option><option value="pending">Pendentes</option><option value="done">Concluídos</option></select><select id="period"><option value="all">Todas as datas</option><option value="today">Hoje</option><option value="week">Próximos 7 dias</option><option value="overdue">Atrasados</option><option value="nodate">Sem data</option></select><button id="backupBtn" class="btn">Backup</button><button id="restoreBtn" class="btn">Restaurar</button><input id="restoreInput" type="file" accept="application/json,.json" hidden><button id="exportBtn" class="btn">Exportar</button></section>
<section class="card"><div class="tablewrap"><table><thead><tr><th class="donecol">DONE</th><th>CLIENTE</th><th>DATA PREVISTA</th><th>OS</th><th>OBSERVAÇÃO</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div><div id="empty" class="empty" hidden><div class="emptyicon">⌕</div><h2>Nenhum cliente encontrado</h2><p>Tente mudar os filtros ou cadastre um novo cliente.</p><button class="btn primary" id="emptyNew">＋ Novo cliente</button></div><div class="footer"><span id="count">0 registros</span><span>Dados salvos neste navegador</span></div></section>
</div>
<dialog id="dialog"><form id="form" class="modal"><div class="modalhead"><div><div class="kicker">CADASTRO</div><h2 id="modalTitle">Novo cliente</h2></div><button type="button" class="iconbtn" id="closeBtn" aria-label="Fechar">×</button></div><input id="editId" type="hidden"><label>Nome do cliente <b>*</b><input id="name" maxlength="160" required autocomplete="off" placeholder="Ex.: João Carlos"></label><div class="grid2"><label>Data prevista<input id="date" type="date"></label><label>Ordem de Serviço (OS)<input id="os" maxlength="80" placeholder="Ex.: 3321"></label></div><label>Observação<textarea id="notes" maxlength="500" rows="4" placeholder="Opcional"></textarea></label><label class="checkline"><input id="done" type="checkbox"><span><strong>Concluído</strong><small>Marque quando o atendimento estiver finalizado.</small></span></label><div class="actions"><button type="button" class="btn" id="cancelBtn">Cancelar</button><button class="btn primary" type="submit">Salvar</button></div></form></dialog>
<div id="toast" class="toast" role="status"></div><script src="app.js"></script>
</body></html>
